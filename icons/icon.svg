<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7CB8A"/>
      <stop offset="0.5" stop-color="#C9A45B"/>
      <stop offset="1" stop-color="#9A7B3E"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <!-- 먹색 라운드 사각 배경 -->
  <rect x="24" y="24" width="976" height="976" rx="180" fill="url(#bg)"/>

  <!-- 문서 테두리 (오른쪽 위가 열린 ㄱ자 형태) -->
  <path d="M300 250 H720 a56 56 0 0 1 56 56 V430"
        fill="none" stroke="url(#brass)" stroke-width="34" stroke-linecap="round"/>
  <path d="M224 306 a56 56 0 0 1 56 -56"
        fill="none" stroke="url(#brass)" stroke-width="34" stroke-linecap="round"/>
  <path d="M224 306 V774 a56 56 0 0 0 56 56 H470"
        fill="none" stroke="url(#brass)" stroke-width="34" stroke-linecap="round"/>

  <!-- 체크박스 3개 + 체크 -->
  <g fill="none" stroke="url(#brass)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <rect x="292" y="300" width="104" height="104" rx="20"/>
    <path d="M318 352 l22 24 l40 -46"/>
    <rect x="292" y="452" width="104" height="104" rx="20"/>
    <path d="M318 504 l22 24 l40 -46"/>
    <rect x="292" y="604" width="104" height="104" rx="20"/>
    <path d="M318 656 l22 24 l40 -46"/>
  </g>

  <!-- 체크박스 옆 텍스트 줄 -->
  <g stroke="url(#brass)" stroke-width="26" stroke-linecap="round">
    <line x1="440" y1="318" x2="680" y2="318"/>
    <line x1="440" y1="372" x2="620" y2="372"/>
    <line x1="440" y1="470" x2="640" y2="470"/>
    <line x1="440" y1="524" x2="560" y2="524"/>
  </g>

  <!-- 막대그래프 3개 (오른쪽 아래) -->
  <g fill="url(#brass)">
    <rect x="470" y="628" width="86" height="202" rx="16"/>
    <rect x="586" y="560" width="86" height="270" rx="16"/>
    <rect x="702" y="470" width="86" height="360" rx="16"/>
  </g>
</svg>
